<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>原始人拿RPG当攻城锤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Comic Sans MS', cursive;
  }
  canvas { border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  h1 { color: #e0c097; margin-bottom: 20px; font-size: 28px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
  .save-btn {
    margin-top: 20px;
    padding: 12px 32px;
    background: #e07c24;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
  }
  .save-btn:hover { background: #c56a1a; }
</style>
</head>
<body>
<h1>🦴 原始人 × RPG 攻城锤 🏰</h1>
<canvas id="c" width="900" height="600"></canvas>
<button class="save-btn" onclick="saveImage()">💾 保存图片</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function draw() {
  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, 400);
  skyGrad.addColorStop(0, '#4a90d9');
  skyGrad.addColorStop(0.6, '#87CEEB');
  skyGrad.addColorStop(1, '#f5d7a1');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, 900, 400);

  // Sun
  ctx.fillStyle = '#FFD700';
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 40;
  ctx.beginPath();
  ctx.arc(780, 80, 50, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Clouds
  drawCloud(120, 60, 1);
  drawCloud(400, 90, 0.7);
  drawCloud(620, 50, 0.85);

  // Ground
  const groundGrad = ctx.createLinearGradient(0, 380, 0, 600);
  groundGrad.addColorStop(0, '#8B7355');
  groundGrad.addColorStop(0.3, '#6B5B3A');
  groundGrad.addColorStop(1, '#4a3c25');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, 380, 900, 220);

  // Grass patches
  ctx.fillStyle = '#5a7a3a';
  for (let i = 0; i < 20; i++) {
    const x = Math.random() * 900;
    drawGrass(x, 380);
  }

  // Castle (right side)
  drawCastle(650, 180);

  // Caveman (left-center)
  drawCaveman(260, 250);

  // RPG being held as battering ram
  drawRPG(310, 330);

  // Impact effects at castle gate
  drawImpact(600, 360);

  // Title text on ground
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.font = 'bold 14px Comic Sans MS';
  ctx.fillText('Stone Age meets Modern Warfare', 310, 580);
}

function drawCloud(x, y, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(0, 0, 30, 0, Math.PI * 2);
  ctx.arc(30, -10, 35, 0, Math.PI * 2);
  ctx.arc(60, 0, 28, 0, Math.PI * 2);
  ctx.arc(25, 10, 25, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawGrass(x, y) {
  ctx.save();
  ctx.translate(x, y);
  for (let i = -5; i <= 5; i += 3) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.quadraticCurveTo(i + 2, -12, i + 4, -8);
    ctx.strokeStyle = '#4a6a2a';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

function drawCastle(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // Main wall
  const wallGrad = ctx.createLinearGradient(0, 0, 200, 0);
  wallGrad.addColorStop(0, '#8a8a8a');
  wallGrad.addColorStop(0.5, '#a0a0a0');
  wallGrad.addColorStop(1, '#909090');
  ctx.fillStyle = wallGrad;
  ctx.fillRect(0, 40, 200, 160);

  // Stone texture
  ctx.strokeStyle = '#707070';
  ctx.lineWidth = 1;
  for (let row = 0; row < 8; row++) {
    const yy = 40 + row * 20;
    ctx.beginPath();
    ctx.moveTo(0, yy);
    ctx.lineTo(200, yy);
    ctx.stroke();
    const offset = row % 2 === 0 ? 0 : 25;
    for (let col = offset; col < 200; col += 50) {
      ctx.beginPath();
      ctx.moveTo(col, yy);
      ctx.lineTo(col, yy + 20);
      ctx.stroke();
    }
  }

  // Left tower
  ctx.fillStyle = '#7a7a7a';
  ctx.fillRect(-20, 0, 60, 200);
  // Tower battlements
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = '#6a6a6a';
    ctx.fillRect(-20 + i * 20, -15, 12, 20);
  }

  // Right tower
  ctx.fillStyle = '#7a7a7a';
  ctx.fillRect(160, 0, 60, 200);
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = '#6a6a6a';
    ctx.fillRect(160 + i * 20, -15, 12, 20);
  }

  // Wall battlements
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = '#858585';
    ctx.fillRect(40 + i * 20, 28, 12, 16);
  }

  // Gate
  ctx.fillStyle = '#4a3020';
  ctx.beginPath();
  ctx.moveTo(70, 200);
  ctx.lineTo(70, 130);
  ctx.arc(100, 130, 30, Math.PI, 0);
  ctx.lineTo(130, 200);
  ctx.fill();

  // Gate wood planks
  ctx.strokeStyle = '#3a2010';
  ctx.lineWidth = 2;
  for (let i = 75; i < 130; i += 12) {
    ctx.beginPath();
    ctx.moveTo(i, 200);
    ctx.lineTo(i, 135);
    ctx.stroke();
  }

  // Gate iron bands
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 3;
  for (let yy = 145; yy < 200; yy += 20) {
    ctx.beginPath();
    ctx.moveTo(70, yy);
    ctx.lineTo(130, yy);
    ctx.stroke();
  }

  // Cracks in gate (being smashed!)
  ctx.strokeStyle = '#1a1008';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(80, 160);
  ctx.lineTo(75, 150);
  ctx.lineTo(78, 140);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(85, 175);
  ctx.lineTo(82, 165);
  ctx.stroke();

  // Flag on tower
  ctx.fillStyle = '#cc3333';
  ctx.beginPath();
  ctx.moveTo(-10, -15);
  ctx.lineTo(-10, -50);
  ctx.lineTo(20, -40);
  ctx.lineTo(-10, -30);
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-10, -50);
  ctx.lineTo(-10, -10);
  ctx.stroke();

  ctx.restore();
}

function drawCaveman(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // Shadow on ground
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(20, 150, 50, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  // Left leg (stepping forward)
  ctx.fillStyle = '#c49a6c';
  ctx.beginPath();
  ctx.moveTo(5, 110);
  ctx.lineTo(-15, 140);
  ctx.lineTo(-5, 142);
  ctx.lineTo(15, 115);
  ctx.fill();
  // Foot
  ctx.fillStyle = '#b08858';
  ctx.beginPath();
  ctx.ellipse(-12, 144, 14, 6, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // Right leg (back)
  ctx.fillStyle = '#b88a5c';
  ctx.beginPath();
  ctx.moveTo(25, 110);
  ctx.lineTo(40, 138);
  ctx.lineTo(30, 140);
  ctx.lineTo(15, 115);
  ctx.fill();
  // Foot
  ctx.fillStyle = '#a07848';
  ctx.beginPath();
  ctx.ellipse(37, 142, 14, 6, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.fillStyle = '#c49a6c';
  ctx.beginPath();
  ctx.ellipse(15, 80, 28, 38, 0, 0, Math.PI * 2);
  ctx.fill();

  // Leopard skin clothing
  ctx.fillStyle = '#c8a048';
  ctx.beginPath();
  ctx.moveTo(-5, 60);
  ctx.lineTo(35, 55);
  ctx.lineTo(40, 90);
  ctx.lineTo(35, 115);
  ctx.lineTo(-5, 118);
  ctx.lineTo(-10, 85);
  ctx.closePath();
  ctx.fill();

  // Spots on clothing
  ctx.fillStyle = '#8B6914';
  const spots = [[5,70],[20,80],[10,95],[25,100],[15,75],[30,90]];
  spots.forEach(([sx,sy]) => {
    ctx.beginPath();
    ctx.ellipse(sx, sy, 4, 3, Math.random(), 0, Math.PI * 2);
    ctx.fill();
  });

  // Left arm (holding RPG front)
  ctx.fillStyle = '#c49a6c';
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#c49a6c';
  ctx.beginPath();
  ctx.moveTo(-5, 70);
  ctx.quadraticCurveTo(20, 85, 55, 82);
  ctx.stroke();

  // Hand gripping
  ctx.fillStyle = '#b88a5c';
  ctx.beginPath();
  ctx.arc(55, 82, 8, 0, Math.PI * 2);
  ctx.fill();

  // Right arm (holding RPG back, pushing)
  ctx.strokeStyle = '#c49a6c';
  ctx.beginPath();
  ctx.moveTo(30, 68);
  ctx.quadraticCurveTo(60, 70, 80, 78);
  ctx.stroke();

  // Hand gripping
  ctx.fillStyle = '#b88a5c';
  ctx.beginPath();
  ctx.arc(80, 78, 8, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.fillStyle = '#c49a6c';
  ctx.beginPath();
  ctx.arc(15, 35, 24, 0, Math.PI * 2);
  ctx.fill();

  // Wild hair
  ctx.fillStyle = '#4a3020';
  ctx.beginPath();
  ctx.moveTo(-10, 25);
  ctx.quadraticCurveTo(-15, 5, -5, 10);
  ctx.quadraticCurveTo(0, -5, 10, 12);
  ctx.quadraticCurveTo(15, -2, 22, 14);
  ctx.quadraticCurveTo(30, 0, 35, 15);
  ctx.quadraticCurveTo(42, 8, 38, 25);
  ctx.quadraticCurveTo(40, 35, 35, 30);
  ctx.lineTo(35, 35);
  ctx.arc(15, 35, 24, -0.3, Math.PI + 0.3, true);
  ctx.fill();

  // Angry eyebrows
  ctx.strokeStyle = '#4a3020';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(2, 28);
  ctx.lineTo(12, 25);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(18, 25);
  ctx.lineTo(28, 28);
  ctx.stroke();

  // Eyes (determined look)
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.ellipse(8, 32, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(22, 32, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#2a1a0a';
  ctx.beginPath();
  ctx.arc(10, 32, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(24, 32, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Mouth (yelling)
  ctx.fillStyle = '#8B0000';
  ctx.beginPath();
  ctx.ellipse(15, 46, 10, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff6666';
  ctx.beginPath();
  ctx.ellipse(15, 44, 8, 4, 0, 0, Math.PI);
  ctx.fill();

  // Teeth
  ctx.fillStyle = '#ffffee';
  ctx.fillRect(9, 43, 4, 4);
  ctx.fillRect(17, 43, 4, 4);

  // Bone in hair
  ctx.strokeStyle = '#f5f0e0';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(-8, 18);
  ctx.lineTo(38, 14);
  ctx.stroke();
  ctx.fillStyle = '#f5f0e0';
  ctx.beginPath();
  ctx.arc(-8, 18, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(38, 14, 5, 0, Math.PI * 2);
  ctx.fill();

  // Speech bubble - "OOGA BOOGA!"
  ctx.save();
  ctx.fillStyle = 'white';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(80, -10, 75, 30, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Speech bubble tail
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.moveTo(35, 5);
  ctx.lineTo(50, -5);
  ctx.lineTo(45, 10);
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.beginPath();
  ctx.moveTo(35, 5);
  ctx.lineTo(50, -5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(45, 10);
  ctx.lineTo(35, 5);
  ctx.stroke();

  ctx.fillStyle = '#333';
  ctx.font = 'bold 16px Comic Sans MS';
  ctx.textAlign = 'center';
  ctx.fillText('OOGA BOOGA!', 80, -5);
  ctx.restore();

  // Sweat drops (effort!)
  ctx.fillStyle = '#87CEEB';
  ctx.beginPath();
  ctx.moveTo(-12, 35);
  ctx.quadraticCurveTo(-16, 40, -14, 45);
  ctx.quadraticCurveTo(-12, 40, -12, 35);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(42, 30);
  ctx.quadraticCurveTo(46, 35, 44, 40);
  ctx.quadraticCurveTo(42, 35, 42, 30);
  ctx.fill();

  ctx.restore();
}

function drawRPG(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // RPG tube (main body) - being held horizontally as battering ram
  const tubeGrad = ctx.createLinearGradient(0, 0, 280, 0);
  tubeGrad.addColorStop(0, '#3a5a3a');
  tubeGrad.addColorStop(0.3, '#4a6a4a');
  tubeGrad.addColorStop(0.7, '#3a5a3a');
  tubeGrad.addColorStop(1, '#2a4a2a');
  ctx.fillStyle = tubeGrad;

  ctx.beginPath();
  ctx.roundRect(-30, -12, 310, 24, 4);
  ctx.fill();

  // Tube dark stripes
  ctx.fillStyle = '#2a4a2a';
  ctx.fillRect(30, -12, 4, 24);
  ctx.fillRect(80, -12, 4, 24);
  ctx.fillRect(150, -12, 4, 24);
  ctx.fillRect(220, -12, 4, 24);

  // RPG warhead (front, pointing at castle)
  ctx.fillStyle = '#5a5a5a';
  ctx.beginPath();
  ctx.moveTo(280, -10);
  ctx.lineTo(310, -5);
  ctx.lineTo(320, 0);
  ctx.lineTo(310, 5);
  ctx.lineTo(280, 10);
  ctx.closePath();
  ctx.fill();

  // Warhead tip (the pointy part hitting the gate)
  ctx.fillStyle = '#8a2020';
  ctx.beginPath();
  ctx.moveTo(320, 0);
  ctx.lineTo(340, -3);
  ctx.lineTo(345, 0);
  ctx.lineTo(340, 3);
  ctx.closePath();
  ctx.fill();

  // Warhead cone
  ctx.fillStyle = '#707070';
  ctx.beginPath();
  ctx.moveTo(280, -10);
  ctx.lineTo(275, -14);
  ctx.lineTo(280, -12);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(280, 10);
  ctx.lineTo(275, 14);
  ctx.lineTo(280, 12);
  ctx.fill();

  // Rear fins
  ctx.fillStyle = '#3a5a3a';
  ctx.beginPath();
  ctx.moveTo(-30, -12);
  ctx.lineTo(-45, -25);
  ctx.lineTo(-25, -12);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-30, 12);
  ctx.lineTo(-45, 25);
  ctx.lineTo(-25, 12);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-30, 0);
  ctx.lineTo(-50, 0);
  ctx.lineTo(-30, 5);
  ctx.fill();

  // Grip/handle area
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(40, 12, 30, 8);
  ctx.fillRect(40, 18, 8, 15);

  // Trigger guard
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(42, 20);
  ctx.quadraticCurveTo(55, 35, 68, 20);
  ctx.stroke();

  // Sight
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(100, -20, 4, 10);
  ctx.fillRect(96, -22, 12, 3);

  // "ACME" text on tube (humorous)
  ctx.fillStyle = '#c0c0c0';
  ctx.font = 'bold 10px Arial';
  ctx.fillText('RPG-7', 120, 4);

  // Motion lines behind RPG
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 4]);
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(-60, -8 + i * 6);
    ctx.lineTo(-80, -8 + i * 6);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  ctx.restore();
}

function drawImpact(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // Impact star burst
  ctx.fillStyle = '#FFD700';
  for (let i = 0; i < 8; i++) {
    ctx.save();
    ctx.rotate((i * Math.PI * 2) / 8);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-8, -25);
    ctx.lineTo(0, -18);
    ctx.lineTo(8, -25);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Impact center
  ctx.fillStyle = '#FF6600';
  ctx.beginPath();
  ctx.arc(0, 0, 12, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#FFFF00';
  ctx.beginPath();
  ctx.arc(0, 0, 6, 0, Math.PI * 2);
  ctx.fill();

  // Debris particles
  ctx.fillStyle = '#8a8a8a';
  const debris = [[-20,-30],[25,-25],[-15,20],[30,15],[-30,10],[20,-35],[35,-10],[-25,-15]];
  debris.forEach(([dx, dy]) => {
    ctx.beginPath();
    ctx.save();
    ctx.translate(dx, dy);
    ctx.rotate(Math.random() * Math.PI);
    ctx.fillRect(-3, -2, 6, 4);
    ctx.restore();
  });

  // "BOOM" text
  ctx.save();
  ctx.rotate(-0.2);
  ctx.fillStyle = '#FF4400';
  ctx.font = 'bold 28px Comic Sans MS';
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 3;
  ctx.strokeText('BOOM!', -35, -40);
  ctx.fillText('BOOM!', -35, -40);
  ctx.restore();

  // Crack lines radiating from impact
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const angle = (i * Math.PI) / 3 + Math.PI / 6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * 15, Math.sin(angle) * 15);
    const len = 20 + Math.random() * 15;
    ctx.lineTo(Math.cos(angle) * len, Math.sin(angle) * len);
    ctx.stroke();
  }

  ctx.restore();
}

draw();

function saveImage() {
  const link = document.createElement('a');
  link.download = 'caveman-rpg-battering-ram.png';
  link.href = canvas.toDataURL();
  link.click();
}
</script>
</body>
</html>
